# Config Nginx untuk domain: golang.cujud.xyz
# Simpan sebagai: /etc/nginx/sites-available/golang.cujud.xyz

server {
    listen 80;
    server_name golang.cujud.xyz;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Setelah config ini aktif, jalankan:
#   sudo certbot --nginx -d golang.cujud.xyz
# Certbot otomatis nambahin blok "listen 443 ssl" dan redirect HTTP -> HTTPS.
